<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoadScript Playground</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --panel: #ffffff;
      --panel-soft: #f0f1ee;
      --text: #20231f;
      --muted: #6c7168;
      --accent: #2f5f9f;
      --accent-soft: #e6eef9;
      --danger: #b3261e;
      --danger-soft: #fdecea;
      --border: #d9ddd3;
      --shadow: 0 18px 45px rgba(30, 35, 28, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(47, 95, 159, .08), transparent 32%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 42%, #eff1ec 100%);
      font-family: "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 26px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .84);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -.03em;
      font-weight: 680;
    }

    main {
      display: grid;
      grid-template-columns: 280px minmax(420px, 1.1fr) minmax(360px, .78fr);
      gap: 16px;
      height: calc(100vh - 80px);
      padding: 16px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-soft);
    }

    .dev-mode {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      user-select: none;
    }

    .dev-mode input {
      margin: 0;
    }

    .files-panel {
      height: 100%;
      overflow: auto;
      padding: 8px;
    }

    .sidebar-section {
      border-bottom: 1px solid var(--border);
    }

    .sidebar-section:last-child {
      border-bottom: 0;
    }

    .sidebar-section summary {
      padding: 10px 6px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .sidebar-section[open] summary {
      color: var(--accent);
    }

    .sidebar-section-body {
      padding-bottom: 8px;
    }

    .upload-row {
      padding: 0 4px 8px;
    }

    .upload-label {
      display: block;
      width: 100%;
      padding: 9px 10px;
      border: 1px dashed #aeb9c9;
      border-radius: 10px;
      background: #fbfcff;
      color: var(--accent);
      line-height: 1.2;
      font-size: 13px;
      font-weight: 650;
      text-align: center;
      cursor: pointer;
    }

    .upload-label input {
      display: none;
    }

    .file-list {
      padding: 8px;
    }

    .connection-list {
      padding: 8px;
    }

    .other-source-list {
      display: grid;
      gap: 6px;
      padding: 8px;
    }

    .file-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border-radius: 10px;
    }

    .file-row:hover {
      background: var(--accent-soft);
    }

    .connection-row {
      display: block;
      width: 100%;
      padding: 8px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
    }

    .connection-row:hover {
      background: var(--accent-soft);
    }

    .other-source-row {
      display: block;
      width: 100%;
      padding: 8px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
    }

    .other-source-row:hover {
      background: var(--accent-soft);
    }

    .file-name {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--text);
      font: 12px Consolas, monospace;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .file-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .connection-type {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .delete-file {
      width: 26px;
      height: 26px;
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
    }

    .delete-file:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .empty-files {
      padding: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      padding: 8px 12px;
      border: 1px solid #bcc8d8;
      border-radius: 9px;
      background: #ffffff;
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    #editor {
      height: calc(100% - 53px);
      min-height: 360px;
    }

    .output {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .output-tabs {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-soft);
    }

    .output-tab {
      color: var(--muted);
    }

    .output-tab.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .status {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--muted);
      font: 13px Consolas, monospace;
    }

    .status.ok {
      color: #0f6b3a;
      background: #eaf7ef;
    }

    .status.fail {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .output-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 12px 0;
      background: #fbfcfa;
    }

    .copy-error {
      border-color: #d4a7a2;
      color: var(--danger);
      background: #fff8f7;
      font-size: 12px;
    }

    pre,
    .output-text {
      margin: 0;
      padding: 14px;
      overflow: auto;
      font: 12px Consolas, monospace;
      line-height: 1.45;
      white-space: pre-wrap;
      background: #fbfcfa;
    }

    [hidden] {
      display: none !important;
    }

    .result-body {
      overflow: auto;
      background: #fbfcfa;
    }

    .output-panel {
      min-height: 100%;
    }

    .output-panel:not(.active) {
      display: none;
    }

    .result-body .output-text {
      border-bottom: 1px solid var(--border);
    }

    .error-report {
      padding: 14px;
      font: 13px "Segoe UI", sans-serif;
      line-height: 1.45;
      color: var(--text);
    }

    .error-row {
      margin: 0 0 8px;
    }

    .error-label {
      color: var(--muted);
      font-weight: 700;
    }

    .error-message {
      margin: 0 0 10px;
      padding: 10px;
      border: 1px solid var(--danger-soft);
      border-radius: 10px;
      background: #fff8f7;
      color: var(--danger);
      font: 12px Consolas, monospace;
      white-space: pre-wrap;
    }

    .error-details {
      margin-top: 10px;
    }

    .error-details summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 700;
    }

    .error-stack {
      margin: 8px 0 0;
      padding: 10px;
      border-radius: 10px;
      background: #f2f3ef;
      color: #3d4239;
      font: 11px Consolas, monospace;
      white-space: pre-wrap;
    }

    .progress-log {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: #fbfcfa;
    }

    .progress-event {
      display: flex;
      gap: 8px;
      align-items: baseline;
      color: var(--text);
      font: 13px "Segoe UI", sans-serif;
    }

    .progress-event.debug {
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    .progress-time {
      flex: 0 0 auto;
      color: var(--muted);
      font: 11px Consolas, monospace;
    }

    .preview {
      padding: 12px 14px 14px;
    }

    .table-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .table-tab {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    .table-tab.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .preview-table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }

    .preview-table {
      width: 100%;
      border-collapse: collapse;
      font: 12px Consolas, monospace;
      text-align: left;
    }

    .preview-table th,
    .preview-table td {
      max-width: 260px;
      padding: 7px 9px;
      border-bottom: 1px solid #edf0ea;
      text-align: left;
      vertical-align: top;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-table th {
      position: sticky;
      top: 0;
      background: #f4f6f2;
      color: #3b4238;
      font-weight: 700;
    }

    .preview-table td.preview-value-right {
      text-align: right;
    }

    .preview-table td.preview-value-left {
      text-align: left;
    }

    .preview-null {
      color: var(--muted);
      font-style: italic;
    }

    .preview-message {
      color: var(--muted);
      font: 13px "Segoe UI", sans-serif;
      white-space: pre-wrap;
    }

    .monaco-editor .line-error {
      background: rgba(179, 38, 30, .12);
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
        height: auto;
      }

      #editor {
        height: 520px;
      }

      .card.output {
        min-height: 460px;
      }

      header {
        display: block;
      }

    }
  </style>
</head>
<body>
  <header>
    <h1>LoadScript Playground</h1>
  </header>

  <main>
    <aside class="card files-panel">
      <details class="sidebar-section" open>
        <summary>Файлы</summary>
        <div class="sidebar-section-body">
          <div class="upload-row">
            <label class="upload-label">
              Загрузить файл
              <input type="file" id="file-upload">
            </label>
          </div>
          <div class="file-list" id="file-list">
            <div class="empty-files">Файлы еще не загружены.</div>
          </div>
        </div>
      </details>

      <details class="sidebar-section" open>
        <summary>Подключения</summary>
        <div class="sidebar-section-body">
          <div class="connection-list" id="connection-list">
            <div class="empty-files">No connections.</div>
          </div>
        </div>
      </details>

      <details class="sidebar-section">
        <summary>Другое</summary>
        <div class="sidebar-section-body">
          <div class="other-source-list" id="other-source-list">
            <button class="other-source-row" type="button" data-source-template="Calendar">
              <div class="file-name">Calendar</div>
              <div class="connection-type">Календарь по диапазону дат</div>
            </button>
            <button class="other-source-row" type="button" data-source-template="Numbers">
              <div class="file-name">Numbers</div>
              <div class="connection-type">Последовательность чисел</div>
            </button>
            <button class="other-source-row" type="button" data-source-template="Inline">
              <div class="file-name">Inline</div>
              <div class="connection-type">Данные прямо в скрипте</div>
            </button>
          </div>
        </div>
      </details>
    </aside>

    <section class="card">
      <div class="toolbar">
        <button class="primary" id="run">Run script</button>
        <button id="parse">Parse only</button>
        <button id="sample">Reset sample</button>
        <label class="dev-mode" title="Limit every source to first 100 rows before temp table">
          <input type="checkbox" id="dev-mode">
          DevMode 100 rows
        </label>
      </div>
      <div id="editor"></div>
    </section>

    <section class="card output">
      <div class="output-tabs" role="tablist" aria-label="Output tabs">
        <button class="output-tab active" id="info-tab" type="button" role="tab" aria-selected="true" aria-controls="info-panel">Инфо</button>
        <button class="output-tab" id="data-tab" type="button" role="tab" aria-selected="false" aria-controls="data-panel">Данные</button>
      </div>
      <div class="result-body">
        <div class="output-panel active" id="info-panel" role="tabpanel" aria-labelledby="info-tab">
          <div class="status" id="status">Готово</div>
          <div class="output-actions" id="output-actions" hidden>
            <button class="copy-error" id="copy-error" type="button">Скопировать ошибку</button>
          </div>
          <pre id="output">Напиши script и нажми Run.</pre>
          <div class="progress-log" id="progress-log" hidden></div>
        </div>
        <div class="output-panel" id="data-panel" role="tabpanel" aria-labelledby="data-tab">
          <div class="preview" id="preview" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.MonacoEnvironment = {
      getWorkerUrl: function () {
        const worker = 'self.MonacoEnvironment={baseUrl:"https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/"};importScripts("https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/base/worker/workerMain.js");';
        return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(worker);
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script>
    const sample = `orders: LOAD
    id,
    city,
    amount.Num() AS amount
FROM Csv(path='orders.csv', delimiter=',', header=true)
WHERE amount > 0
ORDER BY city ASC
LIMIT 10;`;

    let editor;
    let decorations = [];
    let lastFailureResponse = null;
    let progressSource = null;

    const status = document.getElementById('status');
    let output = document.getElementById('output');
    if (output.tagName === 'PRE') {
      const replacement = document.createElement('div');
      replacement.id = output.id;
      replacement.className = 'output-text';
      replacement.textContent = output.textContent;
      output.replaceWith(replacement);
      output = replacement;
    }
    const preview = document.getElementById('preview');
    const infoTab = document.getElementById('info-tab');
    const dataTab = document.getElementById('data-tab');
    const infoPanel = document.getElementById('info-panel');
    const dataPanel = document.getElementById('data-panel');
    const runButton = document.getElementById('run');
    const parseButton = document.getElementById('parse');
    const sampleButton = document.getElementById('sample');
    const devMode = document.getElementById('dev-mode');
    const fileUpload = document.getElementById('file-upload');
    const fileList = document.getElementById('file-list');
    const connectionList = document.getElementById('connection-list');
    const otherSourceList = document.getElementById('other-source-list');
    const outputActions = document.getElementById('output-actions');
    const copyErrorButton = document.getElementById('copy-error');
    const progressLog = document.getElementById('progress-log');
    refreshFiles();
    refreshConnections();
    refreshLastRun();
    infoTab.onclick = () => activateOutputTab('info');
    dataTab.onclick = () => activateOutputTab('data');

    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      monaco.languages.register({ id: 'loader-script' });
      monaco.languages.setMonarchTokensProvider('loader-script', {
        ignoreCase: true,
        tokenizer: {
          root: [
            [/\/\*/, 'comment', '@comment'],
            [/\/\/.*$/, 'comment'],
            [/\bSQL\b/, 'keyword.sql', '@sql'],
            [/\b(DROP|LOAD|FROM|WHERE|GROUP|BY|ORDER|ASC|DESC|LIMIT|OFFSET|AS|true|false|null)\b/, 'keyword'],
            [/\[[^\]]*\]/, 'blocked-name'],
            [/'([^'\\]|\\.)*'/, 'string'],
            [/[0-9]+(\.[0-9]+)?/, 'number'],
            [/--.*$/, 'comment'],
            [/[a-zA-Z_][a-zA-Z0-9_]*(?=\s*\()/, 'function'],
            [/[a-zA-Z_][a-zA-Z0-9_]*/, 'identifier']
          ],
          sql: [
            [/;/, 'delimiter', '@pop'],
            [/\/\*/, 'comment', '@comment'],
            [/--.*$/, 'comment'],
            [/'([^'\\]|\\.)*'/, 'string'],
            [/"([^"\\]|\\.)*"/, 'string'],
            [/`([^`\\]|\\.)*`/, 'string'],
            [/[0-9]+(\.[0-9]+)?/, 'number'],
            [/\b(SELECT|FROM|WHERE|JOIN|INNER|LEFT|RIGHT|FULL|OUTER|ON|GROUP|BY|ORDER|ASC|DESC|LIMIT|OFFSET|HAVING|UNION|ALL|DISTINCT|AS|CASE|WHEN|THEN|ELSE|END|AND|OR|NOT|NULL|IS|IN|LIKE|BETWEEN|EXISTS|WITH|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER)\b/, 'keyword.sql'],
            [/[a-zA-Z_][a-zA-Z0-9_]*/, 'identifier.sql']
          ],
          comment: [
            [/[^/*]+/, 'comment'],
            [/\*\//, 'comment', '@pop'],
            [/[/*]/, 'comment']
          ]
        }
      });
      monaco.editor.defineTheme('loader-light', {
        base: 'vs',
        inherit: true,
        rules: [
          { token: 'keyword', foreground: '2f5f9f', fontStyle: 'bold' },
          { token: 'keyword.sql', foreground: '0f6b5f', fontStyle: 'bold' },
          { token: 'identifier', foreground: '1f2933' },
          { token: 'function', foreground: '1f2933' },
          { token: 'identifier.sql', foreground: '3f4b59' },
          { token: 'blocked-name', foreground: '1f2933' },
          { token: 'string', foreground: '8a4b00' },
          { token: 'number', foreground: '1f6f78' },
          { token: 'comment', foreground: '7a8175' },
          { token: 'delimiter', foreground: '52606d' }
        ],
        colors: {
          'editor.background': '#ffffff',
          'editor.lineHighlightBackground': '#f4f7fb',
          'editorCursor.foreground': '#2f5f9f',
          'editorLineNumber.foreground': '#9aa19a'
        }
      });
      editor = monaco.editor.create(document.getElementById('editor'), {
        value: localStorage.getItem('loader-playground-script') || sample,
        language: 'loader-script',
        theme: 'loader-light',
        automaticLayout: true,
        minimap: { enabled: false },
        fontSize: 14,
        tabSize: 4
      });
      editor.onDidChangeModelContent(() => {
        localStorage.setItem('loader-playground-script', editor.getValue());
        clearMarkers();
      });
    });

    runButton.onclick = () => send('/api/run', 'Выполняю script...');
    parseButton.onclick = () => send('/api/parse', 'Парсю script...');
    sampleButton.onclick = () => {
      editor.setValue(sample);
      clearMarkers();
      clearPreview();
      clearProgress();
      setResult('Готово', 'Напиши script и нажми Run.', null);
    };
    copyErrorButton.onclick = () => copyLastErrorForAi();
    otherSourceList?.addEventListener('click', event => {
      const button = event.target instanceof Element
        ? event.target.closest('[data-source-template]')
        : null;
      if (!button) return;

      insertOtherSourceLoad(button.dataset.sourceTemplate);
    });

    fileUpload.onchange = async () => {
      const file = fileUpload.files && fileUpload.files[0];
      if (!file) return;
      const form = new FormData();
      form.append('file', file);
      try {
        clearPreview();
        clearProgress();
        setResult(`Загружаю файл ${file.name}...`, '', null);
        const response = await fetch('/api/files', {
          method: 'POST',
          body: form
        });
        const json = await response.json();
        renderFiles(json.files || []);
        setResult('Файл загружен', JSON.stringify(json.file, null, 2), true);
      } catch (error) {
        setResult('UPLOAD FAIL', error.stack || error.message, false);
      } finally {
        fileUpload.value = '';
      }
    };

    async function send(url, pendingText) {
      if (!editor) return;
      setBusy(true);
      clearMarkers();
      clearPreview();
      setResult(pendingText, '', null);
      const isRun = url === '/api/run';
      const runId = isRun ? createRunId() : null;
      if (isRun) {
        startProgress(runId);
      }

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script: editor.getValue(), devMode: devMode?.checked === true, runId })
        });
        const json = await response.json();
        if (json.ok) {
          lastFailureResponse = null;
          setResult('OK', formatSuccess(json.data), true);
          renderPreviewTabs(json.data);
        } else {
          lastFailureResponse = json;
          markError(json.error);
          clearPreview();
          setResultHtml(`FAIL: ${json.stage || 'unknown'}`, formatFailure(json), false);
        }
      } catch (error) {
        lastFailureResponse = {
          ok: false,
          stage: 'request',
          error: {
            type: error.name || 'Error',
            message: error.message || String(error),
            stackTrace: error.stack || null
          }
        };
        setResult('REQUEST FAIL', error.stack || error.message, false);
      } finally {
        if (isRun) {
          setTimeout(stopProgress, 250);
        }

        setBusy(false);
      }
    }

    function createRunId() {
      if (window.crypto?.randomUUID) {
        return window.crypto.randomUUID();
      }

      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function startProgress(runId) {
      stopProgress();
      clearProgress();
      if (!runId) return;

      progressSource = new EventSource(`/api/progress/${encodeURIComponent(runId)}`);
      progressSource.addEventListener('progress', event => {
        try {
          appendProgress(JSON.parse(event.data));
        } catch {
          appendProgress({ level: 'Debug', message: event.data });
        }
      });
      progressSource.onerror = () => {
        // SSE сам переподключается. Явно ничего не пишем, чтобы не шуметь пользователю.
      };
    }

    function stopProgress() {
      if (progressSource) {
        progressSource.close();
        progressSource = null;
      }
    }

    function clearProgress() {
      progressLog.hidden = true;
      progressLog.innerHTML = '';
    }

    function appendProgress(progressEvent) {
      const level = String(progressEvent.level || 'User');
      if (level.toLowerCase() === 'debug' && devMode?.checked !== true) {
        return;
      }

      progressLog.hidden = false;
      const row = document.createElement('div');
      row.className = `progress-event ${level.toLowerCase()}`;

      const time = document.createElement('span');
      time.className = 'progress-time';
      time.textContent = formatProgressTime(progressEvent.occurredAt);

      const message = document.createElement('span');
      message.textContent = progressEvent.message || progressEvent.kind || 'progress';

      row.appendChild(time);
      row.appendChild(message);
      progressLog.appendChild(row);
      progressLog.scrollTop = progressLog.scrollHeight;
    }

    function formatProgressTime(value) {
      const date = value ? new Date(value) : new Date();
      if (Number.isNaN(date.getTime())) {
        return '';
      }

      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function setBusy(value) {
      runButton.disabled = value;
      parseButton.disabled = value;
    }

    function activateOutputTab(tab) {
      const isData = tab === 'data';
      infoTab.classList.toggle('active', !isData);
      dataTab.classList.toggle('active', isData);
      infoTab.setAttribute('aria-selected', String(!isData));
      dataTab.setAttribute('aria-selected', String(isData));
      infoPanel.classList.toggle('active', !isData);
      dataPanel.classList.toggle('active', isData);
    }

    function setResult(text, body, ok) {
      activateOutputTab('info');
      status.textContent = text;
      status.className = 'status' + (ok === true ? ' ok' : ok === false ? ' fail' : '');
      output.textContent = body;
      outputActions.hidden = ok !== false || !lastFailureResponse;
    }

    function setResultHtml(text, body, ok) {
      activateOutputTab('info');
      status.textContent = text;
      status.className = 'status' + (ok === true ? ' ok' : ok === false ? ' fail' : '');
      output.innerHTML = body;
      outputActions.hidden = ok !== false || !lastFailureResponse;
    }

    async function copyLastErrorForAi() {
      if (!lastFailureResponse) return;

      const text = formatErrorForAi(lastFailureResponse, editor ? editor.getValue() : '');
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
      }

      const previous = copyErrorButton.textContent;
      copyErrorButton.textContent = 'Copied';
      setTimeout(() => copyErrorButton.textContent = previous, 1200);
    }

    function formatFailure(response) {
      if (!response || !response.error) {
        return `<div class="error-report"><pre>${escapeHtml(JSON.stringify(response, null, 2))}</pre></div>`;
      }

      const error = response.error;
      const loadError = error.type === 'Loader.Script.LoadScriptException';
      if (!loadError) {
        return formatException(error, true);
      }

      const parts = [
        '<div class="error-report">',
        `<div class="error-row"><span class="error-label">Message:</span> ${escapeHtml(error.message)}</div>`,
        `<div class="error-row"><span class="error-label">Statement:</span> ${escapeHtml(formatStatement(error))}</div>`,
        `<div class="error-row"><span class="error-label">Stage:</span> ${escapeHtml(error.scriptStage || 'unknown')}</div>`
      ];

      const diagnostics = collectOwnDiagnostics(error);
      if (diagnostics.length === 0 && error.span) {
        parts.push(`<div class="error-row"><span class="error-label">Span:</span> ${escapeHtml(formatSpan(error.span))}</div>`);
      }

      if (diagnostics.length > 0) {
        parts.push(formatDiagnostics(diagnostics));
      }

      if (error.inner) {
        parts.push(formatException(error.inner, true, false));
      }

      parts.push('</div>');
      return parts.join('');
    }

    function formatException(error, includeDetails, includeDiagnostics = true) {
      const parts = ['<div class="error-report">'];
      parts.push(`<div class="error-row"><span class="error-label">Type:</span> ${escapeHtml(error.type || 'unknown')}</div>`);
      parts.push(`<div class="error-message">${escapeHtml(error.message || '')}</div>`);
      if (error.scriptStage) {
        parts.push(`<div class="error-row"><span class="error-label">Stage:</span> ${escapeHtml(error.scriptStage)}</div>`);
      }
      const diagnostics = includeDiagnostics ? collectOwnDiagnostics(error) : [];
      if (diagnostics.length === 0 && error.span) {
        parts.push(`<div class="error-row"><span class="error-label">Span:</span> ${escapeHtml(formatSpan(error.span))}</div>`);
      }
      if (diagnostics.length > 0) {
        parts.push(formatDiagnostics(diagnostics));
      }
      if (includeDetails && error.stackTrace) {
        parts.push(formatStackTrace(error.stackTrace));
      }
      if (error.inner) {
        parts.push(formatException(error.inner, true, includeDiagnostics));
      }
      parts.push('</div>');
      return parts.join('');
    }

    function formatDiagnostics(diagnostics) {
      const parts = ['<div class="error-row"><span class="error-label">Errors:</span></div>'];
      for (const diagnostic of diagnostics) {
        parts.push('<div class="error-message">');
        parts.push(escapeHtml(`${formatSpan(diagnostic.span)} ${diagnostic.message}`));
        parts.push('</div>');
      }
      return parts.join('');
    }

    function formatStackTrace(stackTrace) {
      return [
        '<details class="error-details">',
        '<summary>Stack trace</summary>',
        `<pre class="error-stack">${escapeHtml(stackTrace)}</pre>`,
        '</details>'
      ].join('');
    }

    function formatStatement(error) {
      const index = error.statementIndex === undefined || error.statementIndex === null
        ? '?'
        : `#${error.statementIndex}`;
      return `${index} ${error.statementType || ''}`.trim();
    }

    function formatSpan(span) {
      return `${span.startRow}:${span.startColumn + 1}-${span.endRow}:${span.endColumn + 1}`;
    }

    function formatErrorForAi(response, scriptText) {
      const lines = [
        '# Loader Playground bug report',
        '',
        '## Script',
        '```loader',
        scriptText || '',
        '```',
        '',
        '## Failure',
        `Stage: ${response.stage || 'unknown'}`
      ];

      if (response.context) {
        lines.push('', '## Context', '```json', JSON.stringify(response.context, null, 2), '```');
      }

      if (response.error) {
        lines.push('', '## Error summary');
        appendErrorSummary(lines, response.error, 0);
      }

      const diagnostics = collectDiagnostics(response.error);
      if (diagnostics.length > 0) {
        lines.push('', '## Diagnostics');
        for (const diagnostic of diagnostics) {
          lines.push(`- ${formatSpan(diagnostic.span)} ${diagnostic.message}`);
        }
      }

      lines.push('', '## Raw response', '```json', JSON.stringify(response, null, 2), '```');
      return lines.join('\n');
    }

    function appendErrorSummary(lines, error, depth) {
      if (!error) return;

      const prefix = depth === 0 ? '' : `${'  '.repeat(depth)}caused by: `;
      lines.push(`${prefix}${error.type || 'unknown'}`);
      if (error.message) {
        lines.push(`${'  '.repeat(depth)}message: ${error.message}`);
      }
      if (error.statementIndex !== undefined && error.statementIndex !== null) {
        lines.push(`${'  '.repeat(depth)}statement: ${formatStatement(error)}`);
      }
      if (error.scriptStage) {
        lines.push(`${'  '.repeat(depth)}script stage: ${error.scriptStage}`);
      }
      if (error.span) {
        lines.push(`${'  '.repeat(depth)}span: ${formatSpan(error.span)}`);
      }
      if (error.stackTrace) {
        lines.push(`${'  '.repeat(depth)}stack:`, '```text', error.stackTrace, '```');
      }
      if (error.inner) {
        appendErrorSummary(lines, error.inner, depth + 1);
      }
    }

    function formatSuccess(data) {
      if (!data || !Array.isArray(data.tables)) {
        return JSON.stringify(data, null, 2);
      }

      const lines = [];
      if (data.elapsedMs !== undefined && data.elapsedMs !== null) {
        lines.push(`Elapsed: ${data.elapsedMs} ms`);
        lines.push('');
      }

      if (data.tables.length === 0) {
        lines.push('Таблиц нет.');
        return lines.join('\n');
      }

      return lines.join('\n').trimEnd();
    }

    function renderPreviewTabs(data) {
      if (!data || !Array.isArray(data.tables) || data.tables.length === 0) {
        clearPreview();
        return;
      }

      preview.hidden = false;
      preview.innerHTML = '';

      const tabs = document.createElement('div');
      tabs.className = 'table-tabs';
      const tableHost = document.createElement('div');
      tableHost.className = 'preview-table-host';
      preview.appendChild(tabs);
      preview.appendChild(tableHost);

      data.tables.forEach((table, ordinal) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'table-tab';
        button.textContent = table.alias || table.name || `table ${ordinal + 1}`;
        button.title = table.name || button.textContent;
        button.onclick = () => loadPreviewTable(table.index ?? ordinal, button, tabs, tableHost);
        tabs.appendChild(button);
      });

      const first = tabs.querySelector('.table-tab');
      if (first) {
        first.click();
      }
    }

    async function loadPreviewTable(index, activeButton, tabs, tableHost) {
      for (const button of tabs.querySelectorAll('.table-tab')) {
        button.classList.toggle('active', button === activeButton);
      }

      tableHost.innerHTML = '<div class="preview-message">Читаю первые 15 строк...</div>';
      try {
        const response = await fetch(`/api/last-run/tables/${index}/preview`);
        const json = await readJsonResponse(response);
        if (!response.ok) {
          tableHost.textContent = json.error || JSON.stringify(json, null, 2);
          return;
        }

        if (json.ok === false) {
          tableHost.textContent = JSON.stringify(json, null, 2);
          return;
        }

        renderPreviewTable(tableHost, json.fields || [], json.columns || [], json.rows || []);
      } catch (error) {
        tableHost.textContent = error.stack || error.message;
      }
    }

    async function readJsonResponse(response) {
      const text = await response.text();
      if (!text.trim()) {
        throw new Error(`Сервер вернул пустой ответ (${response.status}). Если playground был запущен до последних правок, перезапусти его.`);
      }

      try {
        return JSON.parse(text);
      } catch (error) {
        throw new Error(`Сервер вернул не JSON (${response.status}): ${text.slice(0, 500)}`);
      }
    }

    function renderPreviewTable(host, fields, columns, rows) {
      host.innerHTML = '';
      if (!columns.length) {
        host.innerHTML = '<div class="preview-message">У таблицы нет колонок.</div>';
        return;
      }

      const wrap = document.createElement('div');
      wrap.className = 'preview-table-wrap';
      const table = document.createElement('table');
      table.className = 'preview-table';

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      for (let i = 0; i < columns.length; i++) {
        const column = columns[i];
        const field = Array.isArray(fields) ? fields[i] : null;
        const th = document.createElement('th');
        th.textContent = field?.type ? `${column}: ${field.type}` : column;
        headerRow.appendChild(th);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      for (const row of rows) {
        const tr = document.createElement('tr');
        for (let i = 0; i < columns.length; i++) {
          const td = document.createElement('td');
          const value = row[i];
          const field = Array.isArray(fields) ? fields[i] : null;
          td.classList.add(previewAlignmentClass(field));
          if (value === null || value === undefined) {
            td.textContent = 'NULL';
            td.classList.add('preview-null');
          } else {
            td.textContent = formatPreviewValue(value, field);
            td.title = String(value);
          }

          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      host.appendChild(wrap);
    }

    function previewAlignmentClass(field) {
      const type = String(field?.type || '').toLowerCase();
      return type.includes('text') || type.includes('string')
        ? 'preview-value-left'
        : 'preview-value-right';
    }

    function formatPreviewValue(value, field) {
      const type = String(field?.type || '').toLowerCase();
      if (type.includes('date') || type.includes('time')) {
        return formatPreviewDateValue(value, type) ?? String(value);
      }

      if (typeof value === 'string' && isIsoDateLike(value)) {
        return formatPreviewDateValue(value, type) ?? value;
      }

      return String(value);
    }

    function formatPreviewDateValue(value, type) {
      if (value === null || value === undefined) {
        return null;
      }

      const text = String(value);
      if (type.includes('time') && !type.includes('date') && /^\d{2}:\d{2}:\d{2}(\.\d+)?$/.test(text)) {
        return text.replace(/(\.\d+)?$/, '');
      }

      const date = new Date(text);
      if (Number.isNaN(date.getTime())) {
        return null;
      }

      if (type.includes('time') && !type.includes('date')) {
        return date.toLocaleTimeString();
      }

      return hasZeroTime(date, text)
        ? date.toLocaleDateString()
        : date.toLocaleString();
    }

    function hasZeroTime(date, sourceText) {
      const explicitTime = sourceText.match(/[T\s](\d{2}):(\d{2}):(\d{2})(\.(\d+))?/);
      if (explicitTime) {
        return explicitTime[1] === '00' &&
          explicitTime[2] === '00' &&
          explicitTime[3] === '00' &&
          (!explicitTime[5] || /^0+$/.test(explicitTime[5]));
      }

      if (/^\d{4}-\d{2}-\d{2}$/.test(sourceText)) {
        return true;
      }

      return date.getHours() === 0 &&
        date.getMinutes() === 0 &&
        date.getSeconds() === 0 &&
        date.getMilliseconds() === 0;
    }

    function isIsoDateLike(value) {
      return /^\d{4}-\d{2}-\d{2}([T\s]\d{2}:\d{2}:\d{2}(\.\d+)?(Z|[+-]\d{2}:?\d{2})?)?$/.test(value);
    }

    function clearPreview() {
      preview.hidden = true;
      preview.innerHTML = '';
    }

    function clearMarkers() {
      if (!editor || !window.monaco) return;
      monaco.editor.setModelMarkers(editor.getModel(), 'loader', []);
      decorations = editor.deltaDecorations(decorations, []);
    }

    function markError(error) {
      if (!editor || !error) return;
      const markerErrors = collectMarkerErrors(error);
      if (markerErrors.length === 0) return;

      const markers = markerErrors.map(markerError => {
        const span = markerError.span;
        const range = toMonacoRange(span);
        return {
        severity: monaco.MarkerSeverity.Error,
        message: markerError.message,
        startLineNumber: range.startLineNumber,
        startColumn: range.startColumn,
        endLineNumber: range.endLineNumber,
        endColumn: range.endColumn
        };
      });
      const nextDecorations = markerErrors.map(markerError => ({
        range: toMonacoRange(markerError.span),
        options: {
          isWholeLine: true,
          className: 'line-error'
        }
      }));
      monaco.editor.setModelMarkers(editor.getModel(), 'loader', markers);
      decorations = editor.deltaDecorations(decorations, nextDecorations);
      editor.revealRangeInCenter(toMonacoRange(markerErrors[0].span));
    }

    function collectMarkerErrors(error) {
      const diagnostics = collectDiagnostics(error);
      if (diagnostics.length > 0) {
        return diagnostics;
      }

      const result = [];
      let current = error;
      while (current) {
        if (current.span) {
          result.push({ message: current.message, span: current.span });
        }
        current = current.inner;
      }
      return result;
    }

    function collectDiagnostics(error) {
      const result = [];
      const seen = new Set();
      let current = error;
      while (current) {
        for (const diagnostic of collectOwnDiagnostics(current)) {
          const key = `${diagnostic.span.startRow}:${diagnostic.span.startColumn}:${diagnostic.span.endRow}:${diagnostic.span.endColumn}:${diagnostic.message}`;
          if (seen.has(key)) continue;
          seen.add(key);
          result.push(diagnostic);
        }
        current = current.inner;
      }
      return result;
    }

    function collectOwnDiagnostics(error) {
      if (!Array.isArray(error?.errors)) {
        return [];
      }

      return error.errors
        .filter(diagnostic => diagnostic && diagnostic.span)
        .map(diagnostic => ({
          message: diagnostic.message || error.message,
          span: diagnostic.span
        }));
    }

    function toMonacoRange(span) {
      return new monaco.Range(
        Math.max(1, span.startRow),
        Math.max(1, span.startColumn + 1),
        Math.max(1, span.endRow),
        Math.max(1, span.endColumn + 1)
      );
    }

    async function refreshFiles() {
      try {
        const response = await fetch('/api/files');
        const json = await response.json();
        renderFiles(json.files || []);
      } catch (error) {
        fileList.innerHTML = `<div class="empty-files">Не удалось прочитать loaded_files: ${escapeHtml(error.message)}</div>`;
      }
    }

    async function refreshConnections() {
      if (!connectionList) return;
      try {
        const response = await fetch('/api/connections');
        if (!response.ok) {
          throw new Error(await response.text());
        }

        const json = await response.json();
        renderConnections(json.connections || [], json.warning);
      } catch (error) {
        connectionList.innerHTML = `<div class="empty-files">Cannot read connections: ${escapeHtml(error.message)}</div>`;
      }
    }

    async function refreshLastRun() {
      try {
        const response = await fetch('/api/last-run');
        if (!response.ok) {
          return;
        }

        const json = await response.json();
        if (!json.ok) {
          return;
        }

        setResult('Последний OK', formatSuccess(json.data), true);
        renderPreviewTabs(json.data);
      } catch {
        // Последний успешный запуск нужен только для удобства, поэтому ошибки восстановления не показываем.
      }
    }

    function renderConnections(connections, warning) {
      if (!connectionList) return;
      if (!connections.length) {
        connectionList.innerHTML = warning
          ? `<div class="empty-files">No connections. ${escapeHtml(warning)}</div>`
          : '<div class="empty-files">No connections.</div>';
        return;
      }

      connectionList.innerHTML = '';
      if (warning) {
        const warningRow = document.createElement('div');
        warningRow.className = 'empty-files';
        warningRow.textContent = `PixBI registry skipped: ${warning}`;
        connectionList.appendChild(warningRow);
      }

      for (const connection of connections) {
        const row = document.createElement('button');
        row.className = 'connection-row';
        row.type = 'button';
        row.title = 'Insert LOAD from connection';
        row.onclick = () => insertConnectionLoad(connection);

        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = connection.name;

        const type = document.createElement('div');
        type.className = 'connection-type';
        type.textContent = connection.type || 'Connect';

        row.appendChild(name);
        row.appendChild(type);
        connectionList.appendChild(row);
      }
    }

    function renderFiles(files) {
      if (!files.length) {
        fileList.innerHTML = '<div class="empty-files">Файлы еще не загружены.</div>';
        return;
      }

      fileList.innerHTML = '';
      for (const file of files) {
        const row = document.createElement('div');
        row.className = 'file-row';

        const info = document.createElement('div');
        const name = document.createElement('button');
        name.className = 'file-name';
        name.type = 'button';
        name.title = 'Вставить имя файла в editor';
        name.textContent = file.name;
        name.onclick = () => insertFileLoad(file.name);

        const meta = document.createElement('div');
        meta.className = 'file-meta';
        meta.textContent = `${formatSize(file.size)} | ${new Date(file.modifiedUtc).toLocaleString()}`;

        const remove = document.createElement('button');
        remove.className = 'delete-file';
        remove.type = 'button';
        remove.title = 'Удалить файл';
        remove.textContent = '×';
        remove.onclick = () => deleteFile(file.name);

        info.appendChild(name);
        info.appendChild(meta);
        row.appendChild(info);
        row.appendChild(remove);
        fileList.appendChild(row);
      }
    }

    async function deleteFile(name) {
      if (!confirm(`Удалить ${name}?`)) return;
      try {
        clearPreview();
        const response = await fetch(`/api/files/${encodeURIComponent(name)}`, { method: 'DELETE' });
        const json = await response.json();
        renderFiles(json.files || []);
        setResult('Файл удален', name, true);
      } catch (error) {
        setResult('DELETE FAIL', error.stack || error.message, false);
      }
    }

    function insertFileLoad(name) {
      if (!editor) return;
      insertScript(buildFileLoadScript(name), 'files-panel');
    }

    function insertConnectionLoad(connection) {
      if (!editor) return;
      insertScript(buildConnectionLoadScript(connection), 'connections-panel');
    }

    function insertOtherSourceLoad(template) {
      if (!editor) return;
      insertScript(buildOtherSourceLoadScript(template), 'other-sources-panel');
    }

    function insertScript(text, source) {
      editor.executeEdits(source, [{
        range: editor.getSelection(),
        text,
        forceMoveMarkers: true
      }]);
      editor.focus();
    }

    function buildFileLoadScript(name) {
      const table = formatTableName(toTableName(name));
      const path = quoteScriptString(name);
      const provider = providerForFile(name);
      return `\n${table}:\nLOAD *\nFROM ${provider}(${path});\n`;
    }

    function buildConnectionLoadScript(connection) {
      const table = formatTableName(toTableName(connection.name || 'source'));
      const name = quoteScriptString(connection.name || '');
      return `\n${table}:\nLOAD *\nFROM Connect(${name})\nSQL\n  SELECT *\n  FROM table_name;\n`;
    }

    function buildOtherSourceLoadScript(template) {
      switch (template) {
        case 'Calendar':
          return "\ncalendar:\nLOAD *\nFROM Calendar(min='2024-01-01', max='2024-01-07');\n";

        case 'Numbers':
          return '\nnumbers:\nLOAD\n  number\nFROM Numbers(100);\n';

        case 'Inline':
          return "\ninline_data:\nLOAD *\nFROM Inline(\n  id, name, amount;\n  1, 'Alice', 10.5;\n  2, 'Bob', 20.0\n);\n";

        default:
          return '';
      }
    }

    function providerForFile(name) {
      const lower = name.toLowerCase();
      if (lower.endsWith('.json') || lower.endsWith('.jsonl') || lower.endsWith('.ndjson')) return 'Json';
      if (lower.endsWith('.xlsx') || lower.endsWith('.xls') || lower.endsWith('.xlsm') || lower.endsWith('.xlsb')) return 'Excel';
      if (lower.endsWith('.qvd')) return 'Qvd';
      if (lower.endsWith('.xml')) return 'Xml';
      return 'Csv';
    }

    function toTableName(name) {
      const withoutExtension = name.replace(/\.[^/.]+$/, '');
      const normalized = withoutExtension
        .replace(/[^\p{L}\p{N}_]+/gu, '_')
        .replace(/^_+|_+$/g, '');
      return normalized || 'loaded_table';
    }

    function formatTableName(name) {
      return /^[\p{L}_][\p{L}\p{N}_]*$/u.test(name)
        ? name
        : `[${name.replace(/]/g, ']]')}]`;
    }

    function quoteScriptString(value) {
      return `'${String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'")}'`;
    }

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }
  </script>
</body>
</html>
